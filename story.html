<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки о проспекте — Народный архив</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;800;900&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Merriweather', serif; background-color: #F9F8F6; color: #222222; line-height: 1.8; margin: 0; padding: 40px 20px; }
        .article-container { max-width: 780px; margin: 0 auto; background: #ffffff; padding: 50px; border-radius: 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.05); border: 1px solid #EAEAEA; }
        h1 { font-family: 'Unbounded', sans-serif; font-size: 1.8rem; color: #111111; margin-bottom: 10px; line-height: 1.25; text-transform: uppercase; }
        .author-badge { font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700; color: #E73121; margin-bottom: 25px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        p { font-size: 1.05rem; margin-bottom: 24px; color: #333333; }
        .story-scans { display: grid; grid-template-columns: 1fr; gap: 25px; margin: 35px 0; }
        .story-scans figure { margin: 0; background: #F4F4F2; padding: 14px; border-radius: 14px; border: 1px solid #EAEAEA; }
        .story-scans img { width: 100%; height: auto; border-radius: 8px; display: block; }
        .story-scans figcaption { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #666; margin-top: 10px; text-align: center; font-weight: 500; }
        .back-link { font-family: 'Unbounded', sans-serif; font-size: 0.85rem; color: #E73121; text-decoration: none; font-weight: 700; display: inline-block; margin-bottom: 30px; text-transform: uppercase; }
        @media (max-width: 600px) { .article-container { padding: 25px; } h1 { font-size: 1.4rem; } }
    </style>
</head>
<body>
    <div class="article-container">
        <a href="index.html#archive" class="back-link">← Вернуться на главную страницу</a>
        
        <span class="author-badge">Сурова Наталья Васильевна • Краевед, читательница библиотеки</span>
        <h1>Заметки о проспекте Мориса Тореза</h1>
        
        <p>Ниже представлены рукописные страницы воспоминаний и краеведческих заметок, переданные в архив библиотеки.</p>
        
        <div class="story-scans">
            <figure>
                <img src="story-page1.jpg" alt="Рукописные заметки, страница 1">
                <figcaption>Страница 1</figcaption>
            </figure>
            <figure>
                <img src="story-page2.jpg" alt="Рукописные заметки, страница 2">
                <figcaption>Страница 2</figcaption>
            </figure>
        </div>

        <br>
        <a href="index.html#archive" class="back-link">← Вернуться на главную страницу</a>
    </div>
</body>
</html>
